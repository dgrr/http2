name: Main

on:
  push:
    branches:
      - master
  pull_request:

env:
  GO_VERSION: "1.25"
  GOLANGCI_LINT_VERSION: v2.6.0

jobs:
  main:
    name: Main Process
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check and get dependencies
        run: |
          go mod tidy
          git diff --exit-code go.mod
          git diff --exit-code go.sum

      - name: Vet
        run: go vet ./ ./http2utils/... ./h2spec ./benchmark/... ./examples/...

      - name: Build examples
        run: go build ./examples/... ./benchmark/...

      - name: Unit tests
        run: go test ./

      # The race detector is the point of this step. Most of what this library
      # gets wrong is concurrent, and none of it shows up without -race.
      - name: Unit tests (race)
        run: go test -race -timeout 15m ./

      - name: h2spec conformance suite
        run: go test ./h2spec

      - name: h2spec conformance suite (race)
        run: go test -race -timeout 15m ./h2spec

      - name: Benchmarks compile and run
        run: go test -run '^$' -bench . -benchtime 10x ./

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: ./ ./http2utils/... ./h2spec

  # Benchmarks are only a regression signal if something compares them against
  # the base commit, so this job runs both sides and diffs them with benchstat.
  # It reports rather than fails: benchmark numbers on shared CI runners are too
  # noisy to gate a merge on.
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Benchmark this branch
        run: go test -run '^$' -bench . -benchtime 1s -count 6 ./ | tee /tmp/new.txt

      - name: Benchmark the base commit
        run: |
          git worktree add /tmp/base "${{ github.event.pull_request.base.sha }}"
          cd /tmp/base
          # The benchmarks may not exist on the base commit yet.
          if go test -run '^$' -bench . -benchtime 1s -count 6 ./ > /tmp/old.txt 2>/dev/null; then
            echo "have_base=true" >> "$GITHUB_ENV"
          else
            echo "base commit has no benchmarks to compare against"
            echo "have_base=false" >> "$GITHUB_ENV"
          fi

      - name: Compare
        run: |
          if [ "$have_base" != "true" ]; then
            echo "### Benchmarks" >> "$GITHUB_STEP_SUMMARY"
            echo "No comparable benchmarks on the base commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Benchmarks vs base"
            echo
            echo '```'
            benchstat /tmp/old.txt /tmp/new.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          benchstat /tmp/old.txt /tmp/new.txt

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target: [FuzzHuffmanDecode, FuzzHPACKNext, FuzzFrameHeaderRead]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # These parsers take bytes straight off the wire from an unauthenticated
      # peer. The committed corpus under testdata/fuzz replays past crashes on
      # every run; the timed pass looks for new ones.
      - name: Fuzz ${{ matrix.target }}
        run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 120s ./

      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: testdata/fuzz

  crossbuild:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # 32-bit: catches the alignment rules for 64-bit atomics, which the
          # amd64 job cannot.
          - goos: linux
            goarch: "386"
          - goos: linux
            goarch: arm
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Vet and build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build ./ ./http2utils/...
          go vet ./ ./http2utils/...
